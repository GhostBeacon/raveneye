; Rabenauge (Repo: raveneye) - Firmware fuer den M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB Flash, kein PSRAM)
; Bauen:   pio run            -> .pio/build/cardputer-adv/firmware.bin
; Flashen: firmware.bin auf die SD-Karte, im M5Launcher "SD" -> Datei -> Install

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Version setzt der GitHub-Workflow (FW_VERSION), lokal bleibt es "dev"
    !echo "-DFW_VERSION=\\\"${FW_VERSION:-dev}\\\""
lib_deps =
    m5stack/M5Cardputer
    bblanchon/ArduinoJson@^7
